services:
  biomass_ros2:
    build:
      context: .
      dockerfile: ros2-docker/Dockerfile
    container_name: biomass-uav-stack-ros2
    ports:
      - "8080:8080"
      - "9090:9090"
    stdin_open: true
    tty: true
    working_dir: /root/biomass-uav-ws
    environment:
      DISPLAY: ${DISPLAY:-:0}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/tmp}
      LIBGL_ALWAYS_SOFTWARE: "0"
      QT_XCB_GL_INTEGRATION: "xcb"
    volumes:
      - ./ros2-ws:/root/biomass-uav-ws
      - ./scripts:/root/biomass-uav-scripts:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    shm_size: "1gb"
    command: bash -lc "exec sleep infinity"
