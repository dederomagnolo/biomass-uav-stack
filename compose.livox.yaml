services:
  biomass_livox:
    build:
      context: .
      dockerfile: ros2-docker/Dockerfile.fastlio
    image: biomass-uav-stack-biomass_livox
    container_name: biomass-uav-stack-livox
    network_mode: host
    runtime: nvidia                      # NOVO: driver/libcuda dentro do container
    privileged: true                     # NOVO: a ZED é USB/UVC
    stdin_open: true
    tty: true
    working_dir: /root/biomass-uav-ws
    environment:
      DISPLAY: ":1"
      XDG_RUNTIME_DIR: /tmp
      LIBGL_ALWAYS_SOFTWARE: "0"
      QT_XCB_GL_INTEGRATION: "xcb"
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all        # NOVO
      NVIDIA_DRIVER_CAPABILITIES: all    # NOVO
    volumes:
      - ./livox-ws:/root/biomass-uav-ws
      - ./scripts:/root/biomass-uav-scripts:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - /dev:/dev                                          # NOVO
      - /usr/local/cuda-12.6:/usr/local/cuda-12.6:ro       # NOVO
      - /usr/local/cuda-12.6:/usr/local/cuda:ro            # NOVO
      - /etc/nv_tegra_release:/etc/nv_tegra_release:ro     # NOVO
    shm_size: "1gb"
    init: true
    restart: unless-stopped
    command: sleep infinity
