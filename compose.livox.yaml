services:
  biomass_livox:
    build:
      context: .
      dockerfile: ros2-docker/Dockerfile.fastlio
    image: biomass-uav-stack-biomass_livox:zed
    container_name: biomass-uav-stack-livox
    network_mode: host
    runtime: nvidia
    privileged: true
    stdin_open: true
    tty: true
    working_dir: /root/biomass-uav-ws
    environment:
      DISPLAY: ":1"
      XDG_RUNTIME_DIR: /tmp
      LIBGL_ALWAYS_SOFTWARE: "0"
      QT_XCB_GL_INTEGRATION: "xcb"
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - ./livox-ws:/root/biomass-uav-ws
      - type: bind
        source: "/media/laris/e50a717d-e7f4-4b57-84b5-09e9dca07507"
        target: "/mnt/pendrive"
        bind:
          create_host_path: false
      - ./scripts:/root/biomass-uav-scripts:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - /dev:/dev
      - /usr/local/cuda-12.6:/usr/local/cuda-12.6:ro
      - /usr/local/cuda-12.6:/usr/local/cuda:ro
      - /etc/nv_tegra_release:/etc/nv_tegra_release:ro
    shm_size: "1gb"
    init: true
    restart: unless-stopped
    command: sleep infinity
